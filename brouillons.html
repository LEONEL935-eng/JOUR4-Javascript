<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liste de Tâches</title>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            margin: 50px;
            color: darkblue;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(219, 49, 49, 0.1);
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background: #eee;
            margin: 5px 0;
            border-radius: 5px;
            cursor: pointer;
        }

        .completed {
            text-decoration: line-through;
            color: black;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Liste de Tâches</h1>
        <input type="text" id="taskInput" placeholder="Ajouter une tâche...">
        <button id="addTask">Ajouter</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const taskInput = document.getElementById("taskInput");
            const addTaskButton = document.getElementById("addTask");
            const taskList = document.getElementById("taskList");

            addTaskButton.addEventListener("click", () => {
                const taskText = taskInput.value.trim();
                if (taskText !== "") {
                    const li = document.createElement("li");
                    li.textContent = taskText;

                    // Marquer comme complété en cliquant
                    li.addEventListener("click", () => {
                        li.classList.toggle("completed");
                    });

                    // Bouton de suppression
                    const deleteButton = document.createElement("button");
                    deleteButton.textContent = "X";
                    deleteButton.style.marginLeft = "10px";
                    deleteButton.addEventListener("click", () => {
                        li.remove();
                    });

                    li.appendChild(deleteButton);
                    taskList.appendChild(li);
                    taskInput.value = "";
                }
            });
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
</body>
</html>
